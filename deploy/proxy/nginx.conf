worker_processes auto;
# percorsi del pacchetto OpenResty per Amazon Linux 2023 (PIDFile della unit = logs/nginx.pid)
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events { worker_connections 1024; }

# TLS proxy in front of vLLM sulla porta 30002.
# Your DNS name and certificate here.
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64m;

    server {
        listen 80;
        server_name llm.example.com;
        # rinnovo Let's Encrypt in webroot: certbot scrive qui la sfida, OpenResty resta acceso
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        server_name llm.example.com;

        ssl_certificate     /etc/letsencrypt/live/llm.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/llm.example.com/privkey.pem;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /v1/chat/completions {
            client_body_buffer_size 64m;
            # stessi parametri di campionamento forzati della L40S (temp 1.0, top_p 0.95, top_k 20)
            rewrite_by_lua_file /usr/local/openresty/nginx/lua/force_modelfile_params.lua;

            proxy_pass http://127.0.0.1:30002/v1/chat/completions;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # reasoning -> reasoning_content + cot_id per Copilot: il corpo cambia lunghezza
            header_filter_by_lua_block { ngx.header.content_length = nil }
            body_filter_by_lua_file /usr/local/openresty/nginx/lua/reasoning_cot.lua;
        }

        location /v1/ {
            proxy_pass http://127.0.0.1:30002;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
